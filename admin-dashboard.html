<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Student Platform</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Snippet -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-sidebar-header">
                <h2>🎓 Admin Panel</h2>
            </div>
            <ul class="admin-nav">
                <li><a href="admin-dashboard.html" class="active">📊 Dashboard</a></li>
                <li><a href="admin-students.html">👥 Students</a></li>
                <li><a href="admin-curricula.html">📚 Curricula</a></li>
                <li><a href="admin-lessons.html">📝 Lessons</a></li>
                <li><a href="admin-tasks.html">✅ Tasks</a></li>
                
                <li><a href="admin-reports.html">📈 Reports</a></li>
                <li><a href="admin-tracking.html">👀 Student Tracking</a></li>
                <li><a href="#" id="logoutBtn">🚪 Logout</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <button class="mobile-menu-btn" onclick="document.getElementById('adminSidebar').classList.toggle('open')">☰</button>
                <div class="admin-header-title">
                    <h1>Dashboard Overview</h1>
                </div>
            </div>

            <div class="stat-grid" id="statGrid">
                <!-- Populated by JS -->
                <div class="stat-card"><div class="stat-title">Loading...</div></div>
            </div>

            <div class="admin-table-container">
                <h3 style="padding: 1rem; margin: 0; border-bottom: 1px solid #E5E7EB;">Recent Activity</h3>
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Student</th>
                            <th>Action</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="activityTableBody">
                        <tr><td colspan="3" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
